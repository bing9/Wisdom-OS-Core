# herdr_tmux.conf — the tmux half of herdr agent detection.
# Loaded by `~/.tmux.conf` via `source-file -q`. Lives in the repo so it is versioned and
# reaches the offsite bundle; the dotfile carries only the one line that points here.
#
# 🔴 WHAT THIS FIXES. A tmux session adopted into a herdr pane (`exec -a claude tmux attach`)
# presented the SHELL's stale title — "host.example $WISDOM_OS_ROOT" — to herdr,
# because tmux's `set-titles` defaults to OFF and it therefore never forwarded the inner
# agent's OSC title outward. herdr's only two `working` rules read the OSC title, so:
#
#   measured 2026-08-17 — all 13 adopted panes reported `idle`, permanently, and herdr had
#   never once said `working` for one, including a pane provably compacting at the time.
#
# Half the sidebar the owner reads could not report a busy agent. This was first diagnosed as
# "structural, not repairable" — wrong, and recorded as wrong in
# a recorded Case tmux had been capturing the
# agent's real title into `#{pane_title}` the whole time (`allow-set-title` is on by default);
# it simply was not passing it on. `blocked` was never affected — that comes from herdr's
# screen-region rules, which always worked on an adopted pane. Only `working` is title-only.
#
# 🔴 THE STRING MUST BE BARE `#{pane_title}`. herdr's rules are anchored at position 0
# (`^[\x{25D0}-\x{25D3}] ` for the half-circle spinner, `^[\x{2733}…] ` for idle), so tmux's
# default `"#S:#I:#W - \"#T\" …"` — or any hostname/prefix decoration someone adds later —
# disables agent detection SILENTLY while looking like a purely cosmetic setting. If an
# adopted pane ever drifts again, run `tmux show -g set-titles-string` before anything else.
#
# Degrades cleanly: for a pane running a plain shell, `#{pane_title}` is the shell's own
# "host ~/cwd" title, i.e. exactly what was displayed before.
#
# VERIFY:  tmux select-pane -t <session> -T '◑ probe'   # then read agent_status back from
#          herdr; restore with the original `#{pane_title}`. Verified this way 2026-08-18:
#          ◑ -> working, ⠋ -> working, ✳ -> done.
# KILL:    tmux set -g set-titles off      (instant, no restart, no file edit)

set -g set-titles on
set -g set-titles-string "#{pane_title}"
